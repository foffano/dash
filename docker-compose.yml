services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - raiox_data:/data
    # Só acessível pela própria VPS; o Caddy (ou o seu proxy) publica para a internet.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

  # HTTPS automático com Let's Encrypt. Ative com: docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  raiox_data:
  caddy_data:
  caddy_config:
